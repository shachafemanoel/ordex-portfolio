apiVersion: v1
kind: ConfigMap
metadata:
  name: oms-config
  namespace: ordex
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  TIMEZONE: "Asia/Jerusalem"
  NEXT_TELEMETRY_DISABLED: "1"
  ENABLE_REQUEST_LOGGING: "true"
  ENABLE_METRICS: "true"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  PORT: "3000"

