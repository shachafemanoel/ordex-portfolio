apiVersion: v1
kind: Secret
metadata:
  name: oms-secrets
  namespace: ordex
type: Opaque
stringData:
  DATABASE_URL: postgresql://user:pass@postgres:5432/ordex?sslmode=prefer
  REDIS_URL: redis://:pass@redis:6379
  WOO_BASE_URL: https://yourstore.com/wp-json/wc/v3
  WOO_CONSUMER_KEY: your_key
  WOO_CONSUMER_SECRET: your_secret
  WOO_WEBHOOK_SECRET: your_webhook_secret
  ENCRYPTION_KEY: replace_with_32_characters_secret
  JWT_SECRET: replace_with_jwt_secret
  GOOGLE_CLIENT_EMAIL: your_sa_email@project.iam.gserviceaccount.com
  GOOGLE_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n"
  GOOGLE_CALENDAR_ID: your_calendar_id@group.calendar.google.com

