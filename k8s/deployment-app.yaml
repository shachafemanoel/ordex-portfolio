apiVersion: apps/v1
kind: Deployment
metadata:
  name: oms-app
  namespace: ordex
  labels:
    app: oms
    tier: web
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: oms
      tier: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: oms
        tier: web
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: ghcr.io/OWNER/REPO:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: oms-config
            - secretRef:
                name: oms-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /api/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
      initContainers:
        - name: migrate
          image: ghcr.io/OWNER/REPO:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: oms-secrets
          command:
            - sh
            - -lc
            - |
              npx prisma migrate deploy && \
              psql "$DATABASE_URL" -f /app/sql/partitioning.sql || true && \
              psql "$DATABASE_URL" -c "CALL ensure_month_partitions(EXTRACT(YEAR FROM NOW())::int, EXTRACT(MONTH FROM NOW())::int)" || true && \
              psql "$DATABASE_URL" -c "CALL ensure_month_partitions(EXTRACT(YEAR FROM NOW() + INTERVAL '1 month')::int, EXTRACT(MONTH FROM NOW() + INTERVAL '1 month')::int)" || true

