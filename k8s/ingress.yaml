apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oms-ingress
  namespace: ordex
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  tls:
    - hosts:
        - ordex.example.com
      secretName: oms-tls
  rules:
    - host: ordex.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oms-app
                port:
                  number: 80

