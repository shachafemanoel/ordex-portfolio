apiVersion: batch/v1
kind: CronJob
metadata:
  name: refresh-dashboards
  namespace: ordex
spec:
  schedule: "*/15 * * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: refresher
              image: ghcr.io/OWNER/REPO:latest
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: oms-secrets
              command:
                - node
                - /app/scripts/refresh-dashboards.ts

