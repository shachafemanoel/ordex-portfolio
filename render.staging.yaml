# Review current Render pricing and obtain budget approval before applying.
# Deploy the same reviewed git commit to staging first, then production.
version: "1"
databases:
  - name: retzef-staging-db
    databaseName: retzef_staging
    user: retzef_staging
    plan: 0.1c-256mb
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: []
services:
  - type: keyvalue
    name: retzef-staging-redis
    plan: 256mb
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
  - type: web
    name: retzef-staging-web
    runtime: node
    repo: https://github.com/shachafemanoel/Ordex
    plan: 0.5c-512mb
    region: frankfurt
    numInstances: 1
    autoDeploy: false
    healthCheckPath: /api/health
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run release:migrate
    startCommand: npm run render-start
    envVars:
      - key: TENANT_ENFORCEMENT
        value: "true"
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: AUTO_SEED_DEMO_DATA
        value: "false"
      - key: AUTH_FALLBACK_ENABLED
        value: "false"
      - key: DEMO_MODE
        value: "false"
      - key: STRICT_REVOKED_KEYS
        value: "1"
      - key: DB_POOL_MAX
        value: "10"
      - key: APP_URL
        sync: false
      - key: AUTH_JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      # Must be a restricted, non-owner runtime role. DIRECT_URL is migration-only.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        fromDatabase:
          name: retzef-staging-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: retzef-staging-redis
          property: connectionString
