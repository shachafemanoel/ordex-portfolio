version: '3.8'

services:
  postgres-dev:
    image: postgres:16-alpine
    container_name: ordex-postgres-dev
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: ordex_dev
      POSTGRES_USER: ordex_user
      POSTGRES_PASSWORD: ordex_dev_password
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ordex_user -d ordex_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  redis-dev:
    image: redis:7-alpine
    container_name: ordex-redis-dev
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: ordex-mailhog
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI
    environment:
      MH_STORAGE: maildir
      MH_MAILDIR_PATH: /maildir

volumes:
  postgres_dev_data:
  redis_dev_data:
